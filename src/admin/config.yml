backend:
  name: git-gateway
  branch: main

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "articles"
    label: "News Articles"
    label_singular: "Article"
    folder: "src/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Photo", name: "image", widget: "image", required: false, hint: "Drag a photo here, or click to choose one." }
      - { label: "Headline", name: "title", widget: "string", hint: "Type or paste the headline." }
      - { label: "Short summary", name: "dek", widget: "text", hint: "One or two sentences that appear under the headline on the homepage." }
      - { label: "Location", name: "location", widget: "string", default: "DAVAO CITY" }
      - { label: "Date", name: "date", widget: "datetime", default: "" }
      - { label: "Article", name: "body", widget: "markdown", hint: "Paste the full news article here." }
